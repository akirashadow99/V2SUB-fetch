
name: fetch

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "YYYYMMDD override (default: yesterday, Asia/Shanghai)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: fetch subscription files
        shell: bash
        env:
          TZ: Asia/Shanghai
          INPUT_DAY: ${{ inputs.day }}
        run: |
          set -u
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          # 站点当天的文件大约 10:00 才发布，取前一天最稳
          DAY="${INPUT_DAY:-$(date -d 'yesterday' +%Y%m%d)}"
          YM="$(printf '%s' "$DAY" | cut -c1-4)/$(printf '%s' "$DAY" | cut -c5-6)"
          OUT="data/$DAY"
          mkdir -p "$OUT"
          echo "DAY=$DAY  YM=$YM"

          get() {
            local g="$1"
            local tmp="$OUT/$g.tmp"
            local code=""
            local attempt
            for attempt in 1 2 3; do
              code=$(curl -sS -L --compressed -A "$UA" -m 40 -o "$tmp" -w '%{http_code}' \
                "https://node.clashnode.cc/uploads/$YM/$g-$DAY.txt" 2>/dev/null || echo 000)
              if [ "$code" = "200" ] && [ -s "$tmp" ] && ! head -c 1 "$tmp" | grep -q '<'; then
                mv "$tmp" "$OUT/$g.txt"
                echo 200
                return
              fi
              rm -f "$tmp"
              sleep 20
            done
            echo "reject-$code"
          }

          miss=0
          for g in 0 1 2 3 4 5 6; do
            c=$(get "$g")
            echo "group$g -> $c"
            if [ "$c" = "200" ]; then miss=0; else miss=$((miss+1)); fi
            [ "$miss" -ge 2 ] && break
          done

          for f in "$OUT"/*.txt; do
            [ -e "$f" ] || continue
            head -c 1 "$f" | grep -q '<' && rm -f "$f"
          done
          ls -l "$OUT" || true

          n=$(ls "$OUT"/*.txt 2>/dev/null | wc -l)
          echo "downloaded=$n"
          if [ "$n" -ge 1 ]; then
            : > data/urls.txt
            for f in "$OUT"/*.txt; do
              g=$(basename "$f" .txt)
              echo "https://ghproxy.net/https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/data/$DAY/$g.txt" >> data/urls.txt
              echo "https://gh-proxy.com/https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/data/$DAY/$g.txt" >> data/urls.txt
            done
            DAY="$DAY" python3 - <<'PY'
          import glob, json, os
          day = os.environ["DAY"]
          files = {}
          for p in sorted(glob.glob(f"data/{day}/*.txt")):
              files[os.path.basename(p)] = os.path.getsize(p)
          json.dump({"date": day, "files": files}, open("data/latest.json", "w"), ensure_ascii=False, indent=1)
          print("SUMMARY", json.dumps(files, ensure_ascii=False))
          PY
          fi

      - name: prune old data
        run: |
          find data -mindepth 1 -maxdepth 1 -type d -name '20*' | sort | head -n -3 | xargs -r rm -rf
          du -sh data || true

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
